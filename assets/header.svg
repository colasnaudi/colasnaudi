<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .fade1 { opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) .1s forwards; }
    .fade2 { opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) .35s forwards; }
    .fade3 { opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) .6s forwards; }
    .fade4 { opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) .85s forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .orb1 { animation: drift1 14s ease-in-out infinite alternate; }
    .orb2 { animation: drift2 18s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(120px,30px); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-140px,-20px); } }
    .pulse { animation: pulse 2s ease-out infinite; transform-origin: 76px 284px; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3); opacity: 0; } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateX(-300px); } to { transform: translateX(1500px); } }
  </style>

  <defs>
    <clipPath id="card"><rect width="1200" height="340" rx="20"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#1E2330" stroke-width="1"/>
    </pattern>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B9CFB" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8B9CFB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C084FC" stop-opacity=".35"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeGrid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0D12" stop-opacity="1"/>
      <stop offset=".45" stop-color="#0B0D12" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0B0D12" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9C3FF"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B9CFB" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8B9CFB"/>
      <stop offset="1" stop-color="#8B9CFB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0B0D12"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle class="orb1" cx="900" cy="90" r="260" fill="url(#g1)"/>
    <circle class="orb2" cx="1080" cy="300" r="220" fill="url(#g2)"/>
    <rect width="1200" height="340" fill="url(#fadeGrid)"/>
    <rect class="scan" x="0" y="338" width="300" height="2" fill="url(#line)"/>

    <!-- right side: code window -->
    <g class="fade4"><g transform="translate(760 70)">
      <rect width="380" height="200" rx="14" fill="#11141B" fill-opacity=".85" stroke="#262B3A"/>
      <circle cx="22" cy="22" r="5" fill="#FF5F57"/>
      <circle cx="40" cy="22" r="5" fill="#FEBC2E"/>
      <circle cx="58" cy="22" r="5" fill="#28C840"/>
      <text x="190" y="26" text-anchor="middle" class="mono" font-size="12" fill="#5B6275">colas.ts</text>
      <g class="mono" font-size="14">
        <text x="22" y="66"><tspan fill="#C084FC">const</tspan><tspan fill="#E6E9F2"> colas </tspan><tspan fill="#5B6275">=</tspan><tspan fill="#E6E9F2"> {</tspan></text>
        <text x="42" y="92"><tspan fill="#8B9CFB">role</tspan><tspan fill="#5B6275">: </tspan><tspan fill="#A5E3B4">"full-stack"</tspan><tspan fill="#5B6275">,</tspan></text>
        <text x="42" y="118"><tspan fill="#8B9CFB">stack</tspan><tspan fill="#5B6275">: [</tspan><tspan fill="#A5E3B4">"React"</tspan><tspan fill="#5B6275">, </tspan><tspan fill="#A5E3B4">"Next.js"</tspan><tspan fill="#5B6275">],</tspan></text>
        <text x="42" y="144"><tspan fill="#8B9CFB">mobile</tspan><tspan fill="#5B6275">: </tspan><tspan fill="#A5E3B4">"React Native"</tspan><tspan fill="#5B6275">,</tspan></text>
        <text x="42" y="170"><tspan fill="#8B9CFB">shipping</tspan><tspan fill="#5B6275">: </tspan><tspan fill="#F9C97C">true</tspan><tspan class="caret" fill="#8B9CFB">▍</tspan></text>
        <text x="22" y="192" fill="#E6E9F2">}</text>
      </g>
    </g></g>

    <!-- left side: identity -->
    <text x="64" y="92" class="mono fade1" font-size="14" letter-spacing="3" fill="#8B9CFB">PARIS, FR · PAYS BASQUE</text>
    <text x="60" y="170" class="sans fade2" font-size="76" font-weight="800" letter-spacing="-2.5" fill="url(#title)">Colas Naudi</text>
    <text x="64" y="214" class="sans fade3" font-size="24" font-weight="500" fill="#CBD0DA">Full-stack Developer · Web &amp; Mobile</text>
    <text x="64" y="246" class="sans fade3" font-size="17" fill="#7C8396">Building digital products from idea to production.</text>

    <g class="fade4">
      <rect x="60" y="268" width="226" height="32" rx="16" fill="#141821" stroke="#2A3150"/>
      <circle class="pulse" cx="76" cy="284" r="5" fill="#8B9CFB"/>
      <circle cx="76" cy="284" r="5" fill="#8B9CFB"/>
      <text x="90" y="289" class="sans" font-size="14" font-weight="600" fill="#E6E9F2">Open to opportunities</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="19.5" stroke="#1E2330"/>
</svg>
