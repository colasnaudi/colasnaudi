<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" fill="none">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .orb { animation: drift 12s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(200px); } }
    .arrow { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
  </style>
  <defs>
    <clipPath id="c"><rect width="1200" height="160" rx="20"/></clipPath>
    <radialGradient id="g" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8B9CFB" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8B9CFB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#252A38"/>
    </pattern>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="160" fill="#0B0D12"/>
    <rect width="1200" height="160" fill="url(#dots)"/>
    <ellipse class="orb" cx="600" cy="170" rx="420" ry="120" fill="url(#g)"/>
    <text x="600" y="72" text-anchor="middle" class="sans" font-size="30" font-weight="700" letter-spacing="-.5" fill="#FFFFFF">Interested in building something together?</text>
    <g class="arrow">
      <text x="600" y="110" text-anchor="middle" class="mono" font-size="15" letter-spacing="1" fill="#8B9CFB">colasnaudi@gmail.com  →</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="159" rx="19.5" stroke="#1E2330"/>
</svg>
