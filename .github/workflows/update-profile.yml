name: Update profile

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate stats card
        run: node scripts/build.mjs --stats
        env:
          # Optional: add a STATS_TOKEN secret (classic PAT, scopes read:user + repo) to include private activity.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || (git commit -m "chore: update profile stats" && git push)

  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FF5A36&color_dots=#F1F3F2,#FFD0BD,#FFA184,#FF5A36,#A8300C
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF5A36&color_dots=#161B22,#4A2418,#7A3420,#C9462A,#FF5A36

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
